name: Build Eminence Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        working-directory: fabric
        run: ./gradlew build

      - name: Upload Fabric JARs
        uses: actions/upload-artifact@v4
        with:
          name: eminence-fabric-jars
          path: fabric/build/libs/*.jar
